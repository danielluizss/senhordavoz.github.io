<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SenhorDaVoz - Hub de Links</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b2214; 
            font-family: 'Georgia', 'Times New Roman', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 12px; 
        }

        .phone-container {
            width: 100%;
            max-width: 450px;
            min-height: 880px;
            margin: auto; 
            background-color: #072714;
            border: 2px solid #b89742; 
            border-radius: 20px;
            padding: 40px 24px;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
        }

        .phone-container::before {
            content: '';
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            bottom: 12px;
            border: 1px solid rgba(184, 151, 66, 0.35);
            border-radius: 14px;
            pointer-events: none;
        }

        /* Cabeçalho */
        .header {
            text-align: center;
            width: 100%;
            margin-bottom: 20px;
            z-index: 2;
        }

        .logo-img {
            width: 230px;
            height: auto;
            margin: 0 auto 15px auto;
            display: block;
        }

        .subtitle-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .subtitle {
            color: #E7DAB6; 
            font-size: 11.5pt;
            font-style: normal;
            font-weight: normal;
            line-height: 1.4;
        }

        /* Lista de Links */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
            z-index: 2;
            flex-grow: 1;
            justify-content: center;
            margin: 20px 0;
        }

        /* Botão Ajustado - Alinhamento Matemático com o início do Logo */
        .link-button {
            width: 100%;
            background: linear-gradient(to bottom, #09331a, #041c0e);
            border: 2px solid #b89742;
            border-radius: 50px;
            padding: 11px 24px;
            
            display: flex;
            align-items: center;
            justify-content: flex-start; 
            
            /* Posiciona o início do ícone exatamente sob a borda esquerda da imagem do logo */
            padding-left: calc(50% - 115px + 24px);
            
            text-decoration: none;
            color: #e6c66e;
            font-size: 13pt;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.25s ease;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.15), 0 4px 8px rgba(0,0,0,0.4);
        }

        .link-button:hover {
            transform: translateY(-2px);
            box-shadow: inset 0 1px 3px rgba(255,255,255,0.25), 0 6px 14px rgba(184, 151, 66, 0.25);
            color: #fff2cc;
            border-color: #d4af37;
        }

        /* Espaço fixo para o ícone */
        .icon-circle {
            width: 36px;
            height: 36px;
            border: 1px solid #b89742;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(184, 151, 66, 0.08);
            color: #e6c66e;
            flex-shrink: 0;
            margin-right: 18px; /* Mantém a distância proporcional até o texto */
        }

        .icon-circle svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Bloco de texto alinhado */
        .text-group {
            display: flex;
            flex-direction: column;
            text-align: left; 
        }

        .title-wrapper {
            display: flex;
            align-items: center;
        }

        .btn-title {
            text-transform: uppercase;
        }

        .btn-subtitle {
            font-size: 8.5pt;
            color: #a39161;
            font-weight: normal;
            font-family: 'Arial', sans-serif;
            margin-top: 2px;
        }

        /* Selo de verificado */
        .verified {
            margin-left: 8px;
            width: 16px;
            height: 16px;
            background-color: #b89742;
            color: #072714;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8.5pt;
            font-weight: bold;
            flex-shrink: 0;
            line-height: 1;
        }
        
        .verified::before { content: '✓'; }

        /* Rodapé */
        .footer {
            width: 100%;
            text-align: center;
            color: #E7DAB6; 
            font-family: 'Arial', sans-serif;
            font-size: 8.5pt;
            line-height: 1.6;
            z-index: 2;
            border-top: 1px solid rgba(184, 151, 66, 0.15);
            padding-top: 15px;
            margin-top: 10px;
        }

        .footer a {
            color: #E7DAB6;
            text-decoration: none;
            font-weight: bold;
        }
        
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
